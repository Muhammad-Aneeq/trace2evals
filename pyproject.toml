[project]
name = "trace2evals"
version = "0.1.0"
description = "Turn agent traces into versioned eval cases you own. Cross-format, local-first, no LLM required."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Aneeq" }]
keywords = ["evals", "agents", "traces", "opentelemetry", "langsmith", "labeling"]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "python-multipart>=0.0.12",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.7",
]

[project.scripts]
t2e = "t2e.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/src/t2e"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend/src"]
addopts = "-q"

[tool.ruff]
# 110 rather than 100: the only violations at 100 were explanatory docstrings and comments in the
# 101-109 range, and reflowing prose to fit an arbitrary width made it read worse. See PLAN.md D-018.
line-length = 110
src = ["backend/src", "tests"]
target-version = "py312"
# Generated artefacts are not source and must not be held to source style.
extend-exclude = ["tests/golden", "backend/src/t2e/web"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
